[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "balatro-mdp"
version = "0.1.0"
description = "Balatro Ante 1 as a finite-horizon MDP: exact solver, sparse sampling and UCT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
balatro-mdp = "balatro_mdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
