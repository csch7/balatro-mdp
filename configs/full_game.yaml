# Greedy play vs UCT on a full deck, Big Blind (~6 min). All methods play the same games.

game:
  deck: standard
  reward_mode: target
  target: 450
params:
  episodes: 100
  seed: 0                   # game i uses seed "<seed>:<i>"
methods:
  - {label: greedy-play, type: greedy}
  - {label: UCT, type: uct, iters: 300, c: 1.0, rollout: greedy}
