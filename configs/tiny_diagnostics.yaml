# 12-card diagnostics (~5-12 min): sparse-sampling ties at C = 1, UCT regret and bias
# on shallower variants, then the regret table on the same deck.

game:
  deck: tiny
  reward_mode: target
  target: 300
params:
  seed: 0
  n_states: 10
  sparse:                   # [H, C, greedy leaf?]
    - [3, 1, false]
    - [2, 1, true]
    - [2, 4, true]
  variants:                 # [hands, discards, target]
    - [1, 1, 200]
    - [2, 0, 300]
    - [2, 1, 300]
  uct_iters: [1000, 8000]
  c: 0.2
  n_roots: 6
regret_params:              # passed to the regret table on this deck
  n_states: 10
  reps: 3
  seed: 0
