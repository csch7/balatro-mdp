# Small-deck diagnostics (~5-12 min): sparse-sampling ties at C = 1, UCT regret and bias on
# shallower variants, then the regret table on the same deck.

game:
  deck: tiny
  reward_mode: target
  target: 300
params:
  seed: 0
  n_states: 10              # roots for the sparse-sampling tie count
  n_roots: 6                # roots per variant for the UCT check
  root_seed: 2
limits:
  max_tree: 500000000
sparse:
  - {label: H=3 C=1, type: sparse, H: 3, C: 1, leaf: null}
  - {label: H=2 C=1, type: sparse, H: 2, C: 1, leaf: greedy}
  - {label: H=2 C=4, type: sparse, H: 2, C: 4, leaf: greedy}
uct: {type: uct, c: 0.2}
uct_iters: [1000, 8000]
variants:                   # [hands, discards, target]
  - [1, 1, 200]
  - [2, 0, 300]
  - [2, 1, 300]
regret:                     # methods default to those in regret_table.yaml
  n_states: 10
  reps: 3
  seed: 0
