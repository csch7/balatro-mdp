# Exact-solver validation (~5 min): ExactSolver vs ReferenceSolver on tiny roots,
# and simulated optimal play vs V* on small roots.

tiny_game:
  deck: tiny
  reward_mode: target
  target: 300
small_game:
  deck: small
  reward_mode: target
  target: 300
params:
  n_tiny: 8
  n_small: 6
  n_ref_small: 2            # small roots also cross-checked with ReferenceSolver (slow)
  episodes: 8000
  seed: 7
