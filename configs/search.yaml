# UCT and flat Monte Carlo vs the discard heuristic, paired on identical seeds (~40-50 min).
# One block of games per entry in `runs`; each entry can override the target and game count.

game:
  preset: full
  reward_mode: target
params:
  iters: 300
  seed: 0
  methods: null             # null = all; or a list of names from experiments/full_game.py
runs:
  - {target: 450, episodes: 300}
  - {target: 600, episodes: 150}
